spring.application.name=json-placeholder
gg.jte.development-mode=true
spring.main.allow-bean-definition-overriding=true

# Cache Configuration
# Set to 'simple' to use in-memory caching instead of Redis
spring.cache.type=redis

# Redis Configuration (only used when spring.cache.type=redis)
spring.data.redis.sentinel.master=mymaster
spring.data.redis.sentinel.nodes=localhost:26379
spring.data.redis.timeout=2000
spring.data.redis.connect-timeout=2000
spring.data.redis.client-type=lettuce
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=-1ms

# Cache TTL Configuration (in seconds) - only for Redis
spring.cache.redis.time-to-live=3600

# --- OpenTelemetry / Observability (Spring Boot 4 native) ---
# Actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Observation annotations (@Observed, @Timed, @Counted)
management.observations.annotations.enabled=true

# Distributed tracing - sample 100% in dev
management.tracing.sampling.probability=1.0

# OTLP endpoints are auto-discovered from Docker Compose (grafana/otel-lgtm container).
# Only set these explicitly when running WITHOUT Docker Compose:
# management.opentelemetry.tracing.export.endpoint=http://localhost:4318/v1/traces
# management.opentelemetry.logging.export.otlp.endpoint=http://localhost:4318/v1/logs
# management.metrics.export.otlp.url=http://localhost:4318/v1/metrics
# management.metrics.export.otlp.step=10s
